default:
  tags: [docker]

stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  AST_ENABLE_MR_PIPELINES: "true"
  FRONTEND_DIR: "frontend"
  BACKEND_DIR: "backend"
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  SAST_EXCLUDED_PATHS: "spec,test,tests,tmp,frontend/coverage/**,backend/target/site/jacoco/**"


workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "push"
    - if: $CI_PIPELINE_SOURCE == "schedule"

# -----------------------------
# Security templates
# -----------------------------
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml
  - template: Jobs/Secret-Detection.gitlab-ci.yml

secret_detection:
  stage: security
  allow_failure: false

sast:
  stage: security

dependency_scanning:
  stage: security

# -----------------------------
# Frontend (Vite / React)
# -----------------------------
frontend:lint:
  stage: lint
  image: node:20
  cache:
    key:
      files:
        - $FRONTEND_DIR/package-lock.json
    paths:
      - $FRONTEND_DIR/.npm/
  script:
    - cd $FRONTEND_DIR
    - npm ci --cache .npm --prefer-offline
    - npm run lint

frontend:format:
  stage: lint
  image: node:20
  cache:
    key:
      files:
        - $FRONTEND_DIR/package-lock.json
    paths:
      - $FRONTEND_DIR/.npm/
  script:
    - cd $FRONTEND_DIR
    - npm ci --cache .npm --prefer-offline
    - npm run format:check

frontend:test:
  stage: test
  image: node:20
  cache:
    key:
      files:
        - $FRONTEND_DIR/package-lock.json
    paths:
      - $FRONTEND_DIR/.npm/
  script:
    - cd $FRONTEND_DIR
    - npm ci --cache .npm --prefer-offline
    - npm run test:coverage
    - node -e "const s=require('./coverage/coverage-summary.json'); console.log('FRONTEND_STATEMENTS_COVERAGE='+s.total.statements.pct+'%')"
  coverage: '/FRONTEND_STATEMENTS_COVERAGE=([0-9]+(?:\.[0-9]+)?)%/'
  artifacts:
    when: always
    reports:
      junit:
        - $FRONTEND_DIR/reports/junit.xml
      coverage_report:
        coverage_format: cobertura
        path: $FRONTEND_DIR/coverage/cobertura-coverage.xml
    paths:
      - $FRONTEND_DIR/coverage/
      - $FRONTEND_DIR/reports/
    expire_in: 1 week

frontend:build:
  stage: build
  image: node:20
  needs: ["frontend:test"]
  cache:
    key:
      files:
        - $FRONTEND_DIR/package-lock.json
    paths:
      - $FRONTEND_DIR/.npm/
  script:
    - cd $FRONTEND_DIR
    - npm ci --cache .npm --prefer-offline
    - npm run build
  artifacts:
    paths:
      - $FRONTEND_DIR/dist/
    expire_in: 1 week

frontend:containerise:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: ["frontend:build"]
  variables:
    VITE_API_URL: "https://api.phone-shield.com"
    BUILD_MODE: "prod"
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
      variables:
        VITE_API_URL: "https://api.sit.phone-shield.com"
        BUILD_MODE: "sit"
    - if: '$CI_COMMIT_BRANCH == "360-sit-environment-deployment"'
      variables:
        VITE_API_URL: "https://api.sit.phone-shield.com"
        BUILD_MODE: "sit"
    - if: '$CI_COMMIT_BRANCH == "main"'
      variables:
        VITE_API_URL: "https://api.phone-shield.com"
        BUILD_MODE: "prod"
    - when: on_success
  script:
    - export AR_HOST="${GCP_REGION}-docker.pkg.dev"
    - export FRONTEND_IMAGE_URI="${AR_HOST}/${GCP_PROJECT_ID}/${AR_REPO}/frontend"

    - SA_JSON="${CI_PROJECT_DIR}/sa.json"
    - echo "$GCP_SA_KEY_B64" | base64 -d > "$SA_JSON"

    - mkdir -p /kaniko/.docker
    - |
      AUTH_B64="$(printf '_json_key:%s' "$(cat "$SA_JSON")" | base64 | tr -d '\n')"
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${AR_HOST}": {
            "auth": "${AUTH_B64}"
          }
        }
      }
      EOF
    - echo 'precedence ::ffff:0:0/96  100' > /etc/gai.conf || true
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/frontend" \
        --dockerfile "${CI_PROJECT_DIR}/frontend/Dockerfile" \
        --custom-platform linux/amd64 \
        --build-arg BUILD_MODE="${BUILD_MODE}" \
        --build-arg VITE_API_URL="${VITE_API_URL}" \
        --destination "${FRONTEND_IMAGE_URI}:${CI_COMMIT_SHA}" \
        --destination "${FRONTEND_IMAGE_URI}:latest"

# -----------------------------
# Backend (Spring Boot / Maven)
# -----------------------------
backend:format:
  stage: lint
  image: maven:3.9.6-eclipse-temurin-21
  cache:
    key:
      files:
        - $BACKEND_DIR/pom.xml
    paths:
      - .m2/repository/
  script:
    - cd $BACKEND_DIR
    - mvn -B -DskipTests spotless:check

backend:lint:
  stage: lint
  image: maven:3.9.6-eclipse-temurin-21
  cache:
    key:
      files:
        - $BACKEND_DIR/pom.xml
    paths:
      - .m2/repository/
  script:
    - cd $BACKEND_DIR
    - mvn -B -DskipTests checkstyle:check

backend:test:
  stage: test
  image: maven:3.9.6-eclipse-temurin-21
  services:
    - postgres:15
  variables:
    POSTGRES_DB: streamline
    POSTGRES_USER: streamline
    POSTGRES_PASSWORD: password

    SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/streamline
    SPRING_DATASOURCE_USERNAME: streamline
    SPRING_DATASOURCE_PASSWORD: password

    SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: org.hibernate.dialect.PostgreSQLDialect


    GOOGLE_APPLICATION_CREDENTIALS: "$FIREBASE_SERVICE_ACCOUNT"
    
  cache:
    key:
      files:
        - $BACKEND_DIR/pom.xml
    paths:
      - .m2/repository/
  before_script:
    - apt-get update && apt-get install -y python3
  script:
    - cd $BACKEND_DIR
    - mvn -B clean verify
    - |
      python3 -c "
      import xml.etree.ElementTree as ET
      import sys
      try:
          tree = ET.parse('target/site/jacoco/jacoco.xml')
          root = tree.getroot()
          instr = next(c for c in root.findall('counter') if c.get('type') == 'INSTRUCTION')
          covered, missed = int(instr.get('covered')), int(instr.get('missed'))
          print(f'Total Instruction Coverage: {(covered / (covered + missed)) * 100:.2f}%')
      except Exception as e:
          print(f'Missing report: {e}'); sys.exit(1)
      "
  coverage: '/Total Instruction Coverage: \d+\.\d+%/'
  artifacts:
    when: always
    reports:
      junit:
        - $BACKEND_DIR/target/surefire-reports/*.xml
      coverage_report:
        coverage_format: jacoco
        path: $BACKEND_DIR/target/site/jacoco/jacoco.xml
    paths:
      - $BACKEND_DIR/target/site/jacoco/
      - $BACKEND_DIR/target/surefire-reports/
    expire_in: 1 week

backend:build:
  stage: build
  image: maven:3.9.6-eclipse-temurin-21
  needs: ["backend:test"]
  cache:
    key: "backend-jar-$CI_COMMIT_REF_SLUG"
    paths:
      - $BACKEND_DIR/target/*.jar
      - .m2/repository/
    policy: push
  script:
    - cd $BACKEND_DIR
    - mvn -B -DskipTests package

backend:containerise:
  stage: build
  image:
    name: gcr.io/kaniko-project/executor:debug
    entrypoint: [""]
  needs: ["backend:build"]
  cache:
    key: "backend-jar-$CI_COMMIT_REF_SLUG"
    paths:
      - $BACKEND_DIR/target/*.jar
    policy: pull
  script:
    - export AR_HOST="${GCP_REGION}-docker.pkg.dev"
    - export BACKEND_IMAGE_URI="${AR_HOST}/${GCP_PROJECT_ID}/${AR_REPO}/backend"

    # Write SA json somewhere guaranteed to exist + be writable
    - SA_JSON="${CI_PROJECT_DIR}/sa.json"
    - echo "$GCP_SA_KEY_B64" | base64 -d > "$SA_JSON"

    - mkdir -p /kaniko/.docker
    - |
      AUTH_B64="$(printf '_json_key:%s' "$(cat "$SA_JSON")" | base64 | tr -d '\n')"
      cat > /kaniko/.docker/config.json <<EOF
      {
        "auths": {
          "${AR_HOST}": {
            "auth": "${AUTH_B64}"
          }
        }
      }
      EOF
    - echo 'precedence ::ffff:0:0/96  100' > /etc/gai.conf || true
    - |
      /kaniko/executor \
        --context "${CI_PROJECT_DIR}/backend" \
        --dockerfile "${CI_PROJECT_DIR}/backend/Dockerfile" \
        --custom-platform linux/amd64 \
        --destination "${BACKEND_IMAGE_URI}:${CI_COMMIT_SHA}" \
        --destination "${BACKEND_IMAGE_URI}:latest"

deploy:sit:
  stage: deploy
  image: google/cloud-sdk:slim
  needs: ["backend:containerise", "frontend:containerise"]
  environment:
    name: sit
    url: https://sit.phone-shield.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "dev"'
    - if: '$CI_COMMIT_BRANCH == "360-sit-environment-deployment"'
      when: on_success
  script:
    - SA_JSON="$CI_PROJECT_DIR/sa.json"
    - printf '%s' "$GCP_SA_KEY_B64" | tr -d '\n\r ' | base64 -d > "$SA_JSON"
    - gcloud auth activate-service-account --key-file="$SA_JSON"
    - gcloud config set project "$GCP_PROJECT_ID"

    - export AR_HOST="${GCP_REGION}-docker.pkg.dev"
    - export BACKEND_IMAGE_URI="${AR_HOST}/${GCP_PROJECT_ID}/${AR_REPO}/backend"
    - export FRONTEND_IMAGE_URI="${AR_HOST}/${GCP_PROJECT_ID}/${AR_REPO}/frontend"
    - |
      gcloud run deploy backend-sit \
        --image "${BACKEND_IMAGE_URI}:${CI_COMMIT_SHA}" \
        --region "$GCP_REGION" \
        --platform managed \
        --add-cloudsql-instances "${GCP_PROJECT_ID}:${GCP_REGION}:streamline-sit" \
        --set-env-vars "SPRING_PROFILES_ACTIVE=sit" \
        --set-env-vars "SPRING_DATASOURCE_URL=jdbc:postgresql://localhost/streamline_sit?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${GCP_PROJECT_ID}:${GCP_REGION}:streamline-sit" \
        --set-secrets "SPRING_DATASOURCE_USERNAME=DB_USER_SIT:latest,SPRING_DATASOURCE_PASSWORD=DB_PASS_SIT:latest" \
        --allow-unauthenticated \
        --quiet
    - |
      gcloud run deploy frontend-sit \
        --image "${FRONTEND_IMAGE_URI}:${CI_COMMIT_SHA}" \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --quiet
  
deploy:production:
  stage: deploy
  image: google/cloud-sdk:slim
  needs: ["backend:containerise", "frontend:containerise"]
  environment:
    name: production
    url: https://phone-shield.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
  script:
    - SA_JSON="$CI_PROJECT_DIR/sa.json"
    - printf '%s' "$GCP_SA_KEY_B64" | tr -d '\n\r ' | base64 -d > "$SA_JSON"
    - gcloud auth activate-service-account --key-file="$SA_JSON"
    - gcloud config set project "$GCP_PROJECT_ID"

    - export AR_HOST="${GCP_REGION}-docker.pkg.dev"
    - export BACKEND_IMAGE_URI="${AR_HOST}/${GCP_PROJECT_ID}/${AR_REPO}/backend"
    - export FRONTEND_IMAGE_URI="${AR_HOST}/${GCP_PROJECT_ID}/${AR_REPO}/frontend"

    - |
      gcloud run deploy backend-prod \
        --image "${BACKEND_IMAGE_URI}:${CI_COMMIT_SHA}" \
        --region "$GCP_REGION" \
        --platform managed \
        --add-cloudsql-instances "${GCP_PROJECT_ID}:${GCP_REGION}:project-streamline" \
        --set-env-vars "SPRING_PROFILES_ACTIVE=prod" \
        --set-env-vars "SPRING_DATASOURCE_URL=jdbc:postgresql:///streamline?socketFactory=com.google.cloud.sql.postgres.SocketFactory&cloudSqlInstance=${GCP_PROJECT_ID}:${GCP_REGION}:project-streamline" \
        --set-secrets "SPRING_DATASOURCE_USERNAME=DB_USER:latest,SPRING_DATASOURCE_PASSWORD=DB_PASS:latest" \
        --allow-unauthenticated \
        --quiet

    - |
      gcloud run deploy frontend-prod \
        --image "${FRONTEND_IMAGE_URI}:${CI_COMMIT_SHA}" \
        --region "$GCP_REGION" \
        --platform managed \
        --allow-unauthenticated \
        --quiet