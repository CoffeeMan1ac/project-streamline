spring:
  application:
    name: streamline
    
  datasource:
    url: jdbc:postgresql://localhost:5432/streamline
    username: postgres
    password: postgres
    
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  sql:
    init:
      mode: always
      data-locations:
      - classpath:db/data/product_types.sql
      - classpath:db/data/coverage_categories.sql
      - classpath:db/data/coverages.sql
      - classpath:db/data/products.sql

server:
  port: 8080

logging:
  level:
    root: INFO
    "[com.munichre]": DEBUG
